# This file controls the appearance, introductory documentation, and section order of the MultiQC report.

title: "MitoConda Aggregate Report"
subtitle: "Oxford Nanopore Mitochondrial Amplicon Biodiversity, Phylogeny & Reference DB Profiling"
intro_text: >
  This report summarizes the complete <b>MitoConda</b> analysis pipeline organized into five main analytical sections:
  <b>(1) General Sequencing &amp; Clustering Quality Control</b> (Chopper quality/length filtering, NanoStat long-read metrics, and VSEARCH consensus clustering &amp; <i>de novo</i> chimera removal);
  <b>(2) BLAST + LCA Taxonomic Diversity &amp; Rarefaction</b> (mitochondrial BLASTn homology search, TaxonKit Lowest Common Ancestor abundance barplots, and analytical Hurlbert-Heck rarefaction curves);
  <b>(3) Phylogenetic Analysis</b> (MAFFT fragment alignment, barcode-guided trimAl cleaning, FastTree GTR+GAMMA Maximum-Likelihood phylogeny, and patristic genetic distance placement);
  <b>(4) Summary Comparison: BLAST + LCA vs. Phylogeny</b> (FASTA sequence-by-sequence comparison across methods, per-sample taxonomic richness &amp; Shannon diversity <i>H&prime;</i>, and overall dataset abundance); and
  <b>(5) Reference Database Genetic Distance &amp; Identity Summary</b> (pairwise sequence identity % and genetic <i>p</i>-distance distributions across Phylum, Class, Order, Family, Genus, and Species).

section_comments:
  nanostat: >
    <b>1.2 NanoStat Long-Read Quality Metrics:</b> Evaluates the quality and length distributions of filtered Oxford Nanopore amplicon reads per sample/barcode.
    Check that the <b>Median Read Length</b> matches the expected mitochondrial amplicon size (e.g., ~350–450 bp for 12S rRNA) and that <b>Median Read Quality (Phred Q-score)</b> exceeds Q10–Q12 (≥90–94% per-base accuracy before consensus clustering).

