########### CHOPPER ############
# Quality filtering of ONP data
chopper:
  min_quality: 
    - 10
  min_length: 
    - 300
  max_length: 
    - 800

########### PHYLO ############
# Further exploring diversity by phylogenetic group, just add TaxID of group of interest
phylo_target:
  - "7742" # Vertebrata (all vertebrates: mammals, birds, reptiles, amphibians, fishes)
  #- "40674" # Mammalia
  #- "8782"  # Aves
  #- "8292"  # Amphibia
  #- "8504"  # Lepidosauria (lizards & snakes)
  #- "9397"  # Chiroptera

# Mapping between TaxID and taxon names for clade extraction from LCA lineage
phylo_names:
  7742: "Vertebrata"
  32523: "Tetrapoda"
  7711: "Chordata"
  40674: "Mammalia"
  8782: "Aves"
  8457: "Sauropsida"
  8504: "Lepidosauria"
  8459: "Testudines"
  1294634: "Crocodylia"
  8292: "Amphibia"
  186623: "Actinopteri"
  9397: "Chiroptera"
  9398: "Pteropodidae"
  9415: "Phyllostomidae"

# Mitocondrial Genes to build phylogenetic trees Databases within Fastas
phylo_genes:
  - "12s" #12s_Vertebrata_multi_class
  #- "MTCYB" #MTCYB_Human

# Reference DB deduplication and taxonomic balancing for phylogeny
phylo_db:
  max_per_species: 1  # Keep 1 representative mitogenome per species
  max_per_genus: 5    # Keep up to 5 species per genus for richer genus-level representation
  max_per_group: 600  # Max species per vertebrate class when building Vertebrata (7742) DB

# trimAl gap threshold (after removing reference-only columns not covered by barcodes)
trimal:
  gt: 0.7

########### TAXONOMIC LEVEL ############
